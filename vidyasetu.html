<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VidyaSetu</title>
  <link rel="icon" type="image/png" href="assets/logo-small.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <!-- Application Modules -->
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/router.js"></script>

  <script>
    applyPrefs();
    if (!location.hash) location.hash = '#/home';
    render();
    setOfflineBadge();

    // Register Service Worker for offline app-shell caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
