<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VidyaSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F3A6C8;--deep:#C95F91;--wood:#713F52;--cream:#FFF8F5;--white:#FFFFFF;
  --soft:#FAD6E5;--green:#B6DB61;--leaf:#5E8C45;--sky:#7BA4FF;--water:#5DB7EF;
  --text:#332530;--muted:#806C79;--warn:#D99128;--err:#B9435A;
  --bg:var(--cream);--surface:var(--white);--radius:16px;--font:'Inter','Poppins','Noto Sans Devanagari',system-ui,sans-serif;
  --fs:16px;--nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#241A20;--surface:#332530;--text:#FFF8F5;--muted:#C9B7C1;--soft:#4A3340;}
}
:root[data-theme="dark"]{--bg:#241A20;--surface:#332530;--text:#FFF8F5;--muted:#C9B7C1;--soft:#4A3340;}
:root[data-contrast="high"]{--soft:var(--white);--muted:var(--text);--radius:8px;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.5;transition:background .2s,color .2s}
body.large{--fs:19px} body.xlarge{--fs:22px}
body.reduce-motion *{transition:none!important;animation:none!important}
button,input,select{font-family:inherit;font-size:1rem}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:'Poppins',var(--font);color:var(--wood);margin:0 0 .3em}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

#app{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--soft);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:'Poppins';font-weight:700;color:var(--wood);font-size:1.1rem}
.logo img{width:30px;height:30px;border-radius:9px;object-fit:cover;display:block}
.logo .petal{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--pink);transform:rotate(45deg)}
.topbar-spacer{flex:1}
.icon-btn{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:12px;color:var(--wood);font-size:1.2rem}
.icon-btn:hover{background:var(--soft)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
.badge.online{background:#E3F3D3;color:var(--leaf)}
.badge.offline{background:#FDE9DC;color:var(--warn)}
.badge.syncing{background:#E1EDFF;color:var(--sky)}
.badge.failed{background:#FBE3E8;color:var(--err)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

.layout{flex:1;display:flex}
.sidebar{display:none}
.main{flex:1;padding:16px;padding-bottom:calc(var(--nav-h) + 24px);max-width:960px;margin:0 auto;width:100%}
.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--soft);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-height:48px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600}
.bottomnav a.active{color:var(--deep)}
.bottomnav .ic{font-size:1.25rem}

@media (min-width:1024px){
  .bottomnav{display:none}
  .sidebar{display:flex;flex-direction:column;width:220px;background:var(--surface);border-right:1px solid var(--soft);padding:16px 8px;gap:4px}
  .sidebar a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:var(--wood);text-decoration:none;font-weight:600;min-height:48px}
  .sidebar a.active{background:var(--soft);color:var(--deep)}
  .main{padding:24px 32px}
}

.card{background:var(--surface);border:1px solid var(--soft);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card.pink{background:var(--soft);border-color:var(--pink)}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:none;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--deep);color:#fff}
.btn-secondary{background:var(--green);color:#20330f}
.btn-outline{background:transparent;border:2px solid var(--deep);color:var(--deep)}
.progress{height:14px;border-radius:8px;background:var(--soft);overflow:hidden}
.progress > div{height:100%;background:var(--green);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--surface);border:1px solid var(--soft);border-radius:var(--radius);text-decoration:none;color:var(--wood);font-weight:600;font-size:.85rem;min-height:48px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--soft);border-radius:var(--radius);padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--deep)}
.muted{color:var(--muted);font-size:.9rem}
.toast-wrap{position:fixed;bottom:calc(var(--nav-h) + 16px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--wood);color:#fff;padding:12px 18px;border-radius:12px;max-width:90%;font-size:.9rem}
.placeholder{text-align:center;padding:60px 20px;color:var(--muted)}
</style>
</head>

const store = {
  get(k, d){ try{const v=localStorage.getItem(k); return v===null?d:JSON.parse(v)}catch(e){return d} },
  set(k, v){ try{localStorage.setItem(k, JSON.stringify(v))}catch(e){} }
};
function getLessonProgress(courseId){ const all = store.get('lessonProgress', {}); return all[courseId] || []; }
function markLessonDone(courseId, idx){
  const all = store.get('lessonProgress', {});
  all[courseId] = Array.from(new Set([...(all[courseId]||[]), parseInt(idx)]));
  store.set('lessonProgress', all);
  toast('Your lesson progress was saved.');
  render();
}
function toggleBookmark(courseId, idx){
  const marks = store.get('bookmarks', []);
  const key = courseId+':'+idx;
  const i = marks.indexOf(key);
  if(i>-1) marks.splice(i,1); else marks.push(key);
  store.set('bookmarks', marks);
  toast(i>-1 ? 'Bookmark removed.' : 'Lesson bookmarked.');
}
function saveQuizResult(courseId, score, total){
  const results = store.get('quizResults', []);
  results.push({courseId, score, total, date: new Date().toISOString()});
  store.set('quizResults', results);
}
function finishQuiz(courseId){
  let score = 0; QUIZ.forEach((q,i)=>{ if(quizState.answers[i]===q.correct) score++; });
  saveQuizResult(courseId, score, QUIZ.length);
  
  location.hash = '#/courses/'+courseId+'/quiz/result';
}
function queueDoubtOffline(courseTitle, text){
  const pending = store.get('pendingSyncItems', []);
  pending.push({type:'doubt', course:courseTitle, text, ts:Date.now()});
  store.set('pendingSyncItems', pending);
}
function syncPending(){
  const pending = store.get('pendingSyncItems', []);
  if(pending.length){ store.set('pendingSyncItems', []); }
  store.set('lastSyncTime', Date.now());
}

// ---------- Click sound ----------
let audioCtxGlobal = null;
function playClickSound(){
  try{
    if(!audioCtxGlobal){ audioCtxGlobal = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtxGlobal.state==='suspended') audioCtxGlobal.resume();
    const ctx = audioCtxGlobal;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.09);
  }catch(e){}
}
document.addEventListener('click', function(e){
  const el = e.target.closest('button, a[href^="#"], input[type=\"checkbox\"], input[type=\"radio\"]');
  if(el) playClickSound();
}, true);

// ---------- App state ----------
let state = {
  themeMode: store.get('themeMode','system'),
  accessibility: store.get('accessibilityPreferences',{textSize:'normal',highContrast:false,reducedMotion:false}),
  demoOffline: store.get('demoOffline', false),
  language: store.get('selectedLanguage', 'hi'),
  downloadQuality: store.get('downloadQuality', 'Text + Audio'),
  syncState: 'online', // online | offline | syncing | synced | failed
  lastSync: store.get('lastSyncTime', null)
};

function applyPrefs(){
  const html = document.documentElement;
  html.setAttribute('data-theme', state.themeMode==='system' ? '' : state.themeMode);
  html.setAttribute('data-contrast', state.accessibility.highContrast ? 'high' : '');
  html.setAttribute('lang', state.language==='hi' ? 'hi' : 'en');
  document.body.classList.toggle('large', state.accessibility.textSize==='large');
  document.body.classList.toggle('xlarge', state.accessibility.textSize==='xlarge');
  document.body.classList.toggle('reduce-motion', !!state.accessibility.reducedMotion);
}
applyPrefs();

function toast(msg){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

function setOfflineBadge(){
  const isOffline = state.demoOffline || !navigator.onLine;
  state.syncState = isOffline ? 'offline' : (state.syncState==='offline' ? 'online' : state.syncState);
  render();
}
window.addEventListener('online', ()=>{ if(!state.demoOffline){ state.syncState='syncing'; render(); setTimeout(()=>{state.syncState='synced'; syncPending(); state.lastSync=Date.now(); toast(t('progress_synced_toast')); render();}, 1200);} });
window.addEventListener('offline', ()=>{ toast(t('you_are_offline_toast')); setOfflineBadge(); });

function badgeInfo(){
  const isOffline = state.demoOffline || !navigator.onLine;
  if(isOffline) return {cls:'offline', label:t('badge_offline')};
  if(state.syncState==='syncing') return {cls:'syncing', label:t('badge_syncing')};
  if(state.syncState==='failed') return {cls:'failed', label:t('badge_failed')};
  return {cls:'online', label: state.lastSync ? t('badge_synced') : t('badge_online')};
}

let audio = {playing:false, pos:0, dur:180, speed:1, showTranscript:false};
function audioPlayerHTML(){
  const mm = s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  return `<div class="card" role="group" aria-label="Audio player">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="icon-btn" aria-label="Skip back 10 seconds" onclick="skipAudio(-10)">⏪</button>
      <button class="icon-btn" aria-label="${audio.playing?'Pause':'Play'}" onclick="toggleAudioPlay()">${audio.playing?'⏸':'▶️'}</button>
      <button class="icon-btn" aria-label="Skip forward 10 seconds" onclick="skipAudio(10)">⏩</button>
      <span class="muted">${mm(audio.pos)} / ${mm(audio.dur)}</span>
      ${state.demoOffline||!navigator.onLine?`<span class="badge online" style="margin-left:auto"><span class="dot"></span>${t('available_offline')}</span>`:''}
    </div>
    <input type="range" aria-label="Seek" min="0" max="${audio.dur}" value="${audio.pos}" style="width:100%;margin:8px 0" oninput="audio.pos=parseInt(this.value);render()">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="muted">${state.language==='hi'?'गति':'Speed'}</span>
      ${[0.75,1,1.25,1.5].map(s=>`<button class="btn ${audio.speed===s?'btn-primary':'btn-outline'}" style="min-height:36px;padding:0 10px" onclick="audio.speed=${s};render()">${s}x</button>`).join('')}
      <button class="btn btn-outline" style="min-height:36px;margin-left:auto" onclick="audio.showTranscript=!audio.showTranscript;render()">${audio.showTranscript?(state.language==='hi'?'छिपाएं':'Hide'):(state.language==='hi'?'दिखाएं':'Show')} ${state.language==='hi'?'ट्रांसक्रिप्ट':'Transcript'}</button>
    </div>
    ${audio.showTranscript? `<div class="card" style="margin-top:10px"><b>${state.language==='hi'?'ट्रांसक्रिप्ट':'Transcript'}</b><p class="muted">${state.language==='hi'?'पूर्ण पाठ ट्रांसक्रिप्ट यहां दिखाई देगा।':'Full lesson transcript would appear here for captioned, screen-reader-friendly reading.'}</p></div>` : ''}
  </div>`;
}
function toggleAudioPlay(){ audio.playing=!audio.playing; render(); if(audio.playing) tickAudio(); }
function tickAudio(){ if(!audio.playing) return; audio.pos=Math.min(audio.dur,audio.pos+Math.round(1*audio.speed)); if(audio.pos>=audio.dur) audio.playing=false; render(); if(audio.playing) setTimeout(tickAudio,1000); }
function skipAudio(d){ audio.pos=Math.max(0,Math.min(audio.dur,audio.pos+d)); render(); }

// ---------- Downloads ----------
let DOWNLOADS = [
  {id:'digital-safety', title:'Introduction to Digital Safety', size:'36 MB', progress:100, state:'done'},
  {id:'digital-skills', title:'Digital Skills for College Students', size:'42 MB', progress:65, state:'downloading'},
  {id:'comm-english', title:'Communication and Spoken English', size:'55 MB', progress:20, state:'paused'}
];
function downloadItem(d){
  const bar = `<div class="progress" style="margin:8px 0"><div style="width:${d.progress}%"></div></div>`;
  let actions = '';
  if(d.state==='downloading') actions = `<button class="btn btn-outline" onclick="pauseDownload('${d.id}')">${t('pause')}</button>`;
  else if(d.state==='paused') actions = `<button class="btn btn-primary" onclick="resumeDownload('${d.id}')">${t('resume')}</button>`;
  else if(d.state==='failed') actions = `<button class="btn btn-primary" onclick="retryDownload('${d.id}')">${t('retry')}</button>`;
  actions += ` <button class="btn btn-outline" onclick="deleteDownload('${d.id}')">${t('delete')}</button>`;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between"><b>${d.title}</b><span class="muted">${d.size}</span></div>
    ${bar}<div class="muted">${d.progress}% · ${d.state==='done'?t('available_offline'):d.state}</div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${actions}</div>
  </div>`;
}
function deleteDownload(id){ DOWNLOADS = DOWNLOADS.filter(d=>d.id!==id); toast(t('download_removed_toast')); render(); }
function pauseDownload(id){ const d=DOWNLOADS.find(x=>x.id===id); d.state='paused'; render(); }
function resumeDownload(id){ const d=DOWNLOADS.find(x=>x.id===id); d.state='downloading'; render(); tickDownload(id); }
function retryDownload(id){ const d=DOWNLOADS.find(x=>x.id===id); d.state='downloading'; d.progress=0; render(); tickDownload(id); }
function tickDownload(id){
  const d = DOWNLOADS.find(x=>x.id===id); if(!d || d.state!=='downloading') return;
  d.progress = Math.min(100, d.progress+15);
  if(d.progress>=100){ d.state='done'; toast(t('course_downloaded_toast')); }
  render();
  if(d.state==='downloading') setTimeout(()=>tickDownload(id), 900);
}
function downloadsScreen(){
  const group = s => DOWNLOADS.filter(d=>d.state===s);
  return `<h1 style="font-size:1.3rem">${t('downloads_heading')}</h1>
  ${group('downloading').length?`<h2 style="font-size:1rem">${t('downloading_heading')}</h2>${group('downloading').map(downloadItem).join('')}`:''}
  ${group('paused').length?`<h2 style="font-size:1rem">${t('paused_heading')}</h2>${group('paused').map(downloadItem).join('')}`:''}
  ${group('failed').length?`<h2 style="font-size:1rem">${t('failed_heading')}</h2>${group('failed').map(downloadItem).join('')}`:''}
  <h2 style="font-size:1rem">${t('downloaded_heading')}</h2>${group('done').map(downloadItem).join('') || `<p class="muted">${t('no_downloads_yet')}</p>`}

  {hash:'#/courses/digital-skills/quiz', note:'Start the quiz for this course.'},
  {hash:'#/courses/digital-skills/quiz/q', note:'Answer each question — progress saves locally.'},
  {hash:'#/courses/digital-skills/quiz/review', note:'Review, flag, and jump between answers before submitting.'},
  {hash:'#/courses/digital-skills/quiz/result', note:'View your quiz result.'},
  {hash:'#/progress', note:'Check the Progress dashboard.'},
  {hash:'#/mentor/ask', note:'Submit a doubt — it queues locally while offline.'},
  {hash:'#/mentor', note:'See the doubt queued for sync.'},
  {hash:'#/settings', note:'Turn Demo Offline Mode back off.'},
  {hash:'#/downloads', note:'Click Sync Now and watch progress sync.'}
];
let demo = {active:false, step:0};
function startDemo(){ demo = {active:true, step:0}; location.hash = DEMO_STEPS[0].hash; }
function demoNext(){ demo.step = Math.min(demo.step+1, DEMO_STEPS.length-1); location.hash = DEMO_STEPS[demo.step].hash; }
function demoPrev(){ demo.step = Math.max(demo.step-1, 0); location.hash = DEMO_STEPS[demo.step].hash; }
function endDemo(){ demo.active = false; render(); }
function demoBanner(){
  if(!demo.active) return '';
  const s = DEMO_STEPS[demo.step];
  return `<div class="card pink" style="position:sticky;bottom:calc(var(--nav-h) + 10px);z-index:15">
    <b>${t('demo_step_label')} ${demo.step+1} ${t('of_label')} ${DEMO_STEPS.length}</b>
    <div>${s.note}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-outline" style="min-height:40px" onclick="demoPrev()">${t('back')}</button>
      <button class="btn btn-primary" style="min-height:40px" onclick="${demo.step<DEMO_STEPS.length-1?'demoNext()':'endDemo()'}">${demo.step<DEMO_STEPS.length-1?t('next_step'):t('finish_demo')}</button>
      <button class="btn btn-outline" style="min-height:40px" onclick="endDemo()">${t('end')}</button>
    </div>
  </div>`;
}

function render(){
  const hash = location.hash || '#/home';
  let screenHtml;
  try{
    if(ROUTES[hash]) screenHtml = ROUTES[hash]();
    else {
      const dyn = DYNAMIC_ROUTES.find(d=>d.re.test(hash));
      screenHtml = dyn ? dyn.fn(hash.match(dyn.re)) : placeholderScreen(hash.replace('#/','').replace(/-/g,' ') || 'Screen');
    }
  }catch(e){
    screenHtml = `<div class="placeholder"><h2>${state.language==='hi'?'कुछ रीफ्रेश की जरूरत थी':'Something needed a refresh'}</h2><p>${state.language==='hi'?'आपकी सहेजी गई प्रगति इस डिवाइस पर सुरक्षित है।':'Your saved progress is safe on this device.'}</p><a class="btn btn-primary" href="#/home">${t('back_to_home')}</a></div>`;
  }
  document.getElementById('app').innerHTML = `
    ${topbar()}
    <div class="layout">
      ${sidebar(hash)}
      <main class="main" id="main" tabindex="-1">${screenHtml}${demoBanner()}</main>
    </div>
    ${bottomnav(hash)}
  `;
  document.getElementById('main').focus();
}

window.addEventListener('hashchange', render);

// Best-effort service worker for app-shell offline caching.
// Registration can fail in sandboxed/embedded preview contexts — that's
// expected and handled silently; the app already works offline via
// localStorage regardless of whether this succeeds.
if('serviceWorker' in navigator){
  try{
    const swCode = `
      const CACHE='vidyasetu-shell-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { self.clients.claim(); });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.open(CACHE).then(cache =>
            cache.match(e.request).then(cached => cached || fetch(e.request).then(res => {
              if(e.request.method==='GET' && res.ok) cache.put(e.request, res.clone());
              return res;
            }).catch(() => cached))
          )
        );
      });
    `;
    const blobUrl = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(()=>{});
  }catch(e){}
}

if(!location.hash) location.hash = '#/home';
render();
setOfflineBadge();
</script>
